name: CI

on:
  push:
    branches: [ master ]

  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1. Скачать код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2. Установить Python нужной версии
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # Шаг 3. Кэшировать pip-зависимости
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      # Шаг 4. Установить зависимости из requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Шаг 5. Запустить тесты через pytest
      - name: Run tests
        run: pytest